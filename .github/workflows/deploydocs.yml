name: Documentation

on:
  push:
    branches:
      - main # update to match your development branch (master, main, dev, trunk, ...)
    tags: '*'
  pull_request:

jobs:
  build:
    # These permissions are needed to:
    # - Deploy the documentation: https://documenter.juliadocs.org/stable/man/hosting/#Permissions
    # - Delete old caches: https://github.com/julia-actions/cache#usage
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: 'release'
      - name: Set LD_LIBRARY_PATH for R
        run: echo "LD_LIBRARY_PATH=$(R RHOME)/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
      - name: Install rio from GitHub
        run: Rscript -e 'install.packages(c("remotes", "haven")); remotes::install_github("gesistsa/rio")'
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install pymupdf and point PyCall at this system Python
        run: |
          pip install pymupdf
          echo "PYTHON=$(which python)" >> $GITHUB_ENV
      - uses: julia-actions/setup-julia@v2
        with:
          # Pinned to 1.12 to match CI.yml's known-good stable entry.
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Pre-create Conda.jl's ROOTENV so it never attempts a Miniconda download
        # Conda.jl is a hard PyCall dependency and gets built/precompiled
        # regardless of whether PyCall ends up using it -- and its module-load
        # code unconditionally validates `isdir(ROOTENV)`. We never actually
        # need Conda (PYTHON above points PyCall at this system's real
        # python), but its own Miniconda-fetch-on-first-build is flaky on
        # this runner ("Path to conda environment is not valid", observed on
        # both Julia 1.13.4 and 1.12 -- non-deterministic, not version-tied).
        # An empty placeholder directory satisfies the validation without
        # ever touching the network.
        run: mkdir -p ~/.julia/conda/3/x86_64
      - name: Install dependencies
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - name: Build and deploy
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # If authenticating with GitHub Actions token
