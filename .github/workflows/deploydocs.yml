name: Documentation

on:
  push:
    branches:
      - main # update to match your development branch (master, main, dev, trunk, ...)
    tags: '*'
  pull_request:

jobs:
  build:
    # These permissions are needed to:
    # - Deploy the documentation: https://documenter.juliadocs.org/stable/man/hosting/#Permissions
    # - Delete old caches: https://github.com/julia-actions/cache#usage
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: 'release'
      - name: Set LD_LIBRARY_PATH for R
        run: echo "LD_LIBRARY_PATH=$(R RHOME)/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
      - name: Install rio from GitHub
        run: Rscript -e 'install.packages(c("remotes", "haven")); remotes::install_github("gesistsa/rio")'
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install pymupdf and point PyCall at this system Python
        run: |
          pip install pymupdf
          echo "PYTHON=$(which python)" >> $GITHUB_ENV
      - uses: julia-actions/setup-julia@v2
        with:
          # Pinned to 1.12 (matches CI.yml's stable matrix entry): Julia 1.13.4
          # (what 'version: 1' currently resolves to) hits a Conda.jl bug on
          # this runner -- Conda's own module-load-time `prefix(ROOTENV)`
          # check throws "Path to conda environment is not valid" merely from
          # `import Conda` inside PyCall's build.jl, before ENV["PYTHON"]
          # (set above) is ever consulted. 1.12 and 'pre' (both in CI.yml's
          # matrix) don't hit this; only latest-stable 1.13.4 does.
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - name: Build and deploy
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # If authenticating with GitHub Actions token
